trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
- task: Docker@2
  inputs:
    containerRegistry: 'dvsappacr-conn'
    repository: 'dvsapp'
    command: 'buildAndPush'
    Dockerfile: '**/Dockerfile'
    tags: 'latest'
    addPipelineData: false
    addBaseImageData: false
- task: Bash@3
  inputs:
    targetType: 'inline'
    script: |
      # Write your commands here
      mkdir /tmp/k8s
      cp ./k8s-configs/*.yaml  /tmp/k8s
      ls -l /tmp/k8s
